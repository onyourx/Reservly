# Shopify app configuration for "Reservly".
# Linked to the Partner-dashboard app; `shopify app deploy` from apps/booking
# publishes the theme extension + this config.
name = "reservly"
client_id = "575f34ce7f7e8707d2dd9c29078525ca"
application_url = "https://admin.reservlyapp.com"
embedded = false

[access_scopes]
scopes = "read_products,write_products,read_orders,read_customers,read_publications,write_publications"

[auth]
redirect_urls = ["https://admin.reservlyapp.com/auth/callback"]

[webhooks]
api_version = "2025-07"

  # Relative URIs resolve against application_url, which `shopify app dev`
  # keeps pointed at the tunnel — so webhooks work in dev without manual edits.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/shopify/orders-create"

  # Mandatory privacy webhooks (GDPR/CCPA) — required for apps handling customer data.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/shopify/compliance"

# App Proxy: storefront widget calls /apps/booking/* on the shop domain; Shopify
# signs and forwards to our server's /proxy/* routes.
[app_proxy]
url = "https://admin.reservlyapp.com/proxy"
subpath = "booking"
prefix = "apps"

[build]
# Off deliberately: `shopify app dev` would otherwise repoint the live app at its
# throwaway tunnel, which silently breaks the production app URL for the store.
automatically_update_urls_on_dev = false
